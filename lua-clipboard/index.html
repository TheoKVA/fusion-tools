/*  Name: Lua Clipboard Browser */

:root{
    --bg:#191a1d;
    --panel:#25272c;
    --panel-hover:#31343a;
    --border:#3d4148;
    --accent:#5ea1ff;
    --text:#f0f0f0;
    --muted:#8d939c;
    --success:#2ea043;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",sans-serif;
    max-width: 950px;
    margin-inline: auto;
}

/* ===================================================== */
/* SCREENS                                               */
/* ===================================================== */

.screen{
    padding:24px;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    font-size:14px;
    transition:.15s;
}


/* ===================================================== */
/* TOPBAR                                                */
/* ===================================================== */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.app-title{
    font-size:22px;
    font-weight:600;
}

.count-badge{
    background:#30333a;
    color:#8fb3ff;
    border-radius:999px;
    padding:8px 14px;
    cursor:pointer;
    min-width:50px;
    text-align:center;
    white-space:nowrap;
}

.toolbar-menu{
    position:relative;
}

/* ===================================================== */
/* GRID                                                  */
/* ===================================================== */

.file-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.section-title{
    margin-top:20px;
    margin-bottom:5px;
    color:#c9c9c9;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

@media(max-width:1000px){
    .file-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .file-grid{
        grid-template-columns:1fr;
    }
}

.file-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding: 5px;
    transition:.15s;
    cursor:pointer;
    transition:.15s ease;
    display:flex;
    align-items:center;
    white-space: nowrap;
    gap: 10px;
}

.file-card:hover{
    background:var(--panel-hover);
    border-color:var(--accent);
}
.file-card.copied{
    border: 1px solid var(--success);
    box-shadow:0 0 0 1px var(--success);
}

.file-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#ffffff18;
    flex-shrink:0;
}

.file-name-bloc{
    flex: 1;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.file-title{
    font-size:15px;
    font-weight:600;
    white-space: inherit;
}

.file-name{
    color:var(--muted);
    font-size:12px;
    white-space: inherit;
}

.favorite{
    float:right;
    color:#666;
    font-size:18px;
    padding-right:4px;
}

.favorite.active{
    color:#ffcf4d;
}

/* ===================================================== */
/* SPOTLIGHT                                             */
/* ===================================================== */

#spotlightOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(10px);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding-top:120px;
    padding-left: 20px;
    padding-right: 20px;
    z-index:999;
}

#spotlightBox{
    width:700px;
    background:#25272c;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
}

#spotlightInput{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    padding:18px;
    font-size:20px;
}

.spotlight-item{
    padding:12px 18px;
    cursor:pointer;
}

.spotlight-item:hover,
.spotlight-item.selected{
    background:#353943;
}

.spotlight-sub{
    color:var(--muted);
    font-size:12px;
}

/* ===================================================== */
/* TOAST                                                 */
/* ===================================================== */

#toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--success);
    padding:12px 18px;
    border-radius:8px;
    display:none;
    z-index:2000;
}
</style>

<!-- ===================================================== -->
<!-- SCREEN 1 : DASHBOARD                                 -->
<!-- ===================================================== -->

<div id="appScreen" class="screen">
    <div class="topbar">
        <div class="app-title">

        <div class="toolbar-menu">
            <div id="countBadge" class="count-badge"> 0 </div>

        <div id="favorite-grid" class="file-grid"></div>

        <div class="section-title">Tools</div>
        <div id="all-tool-grid" class="file-grid"></div>
    </div>

        <div class="section-title">Checks</div>
        <div id="checks-grid" class="file-grid"></div>
    </div>

</div>

<!-- ===================================================== -->
<!-- SCREEN 2 : SPOTLIGHT                                 -->
<!-- ===================================================== -->

<div id="spotlightOverlay">
    <div id="spotlightBox">
        <input
            id="spotlightInput"
            type="text"
            placeholder="Search tools..."
            autocomplete="off"
        />
        <div id="spotlightResults"></div>
    </div>
</div>

<div id="toast"></div>

<script>

// =====================================================
// GLOBALS
// =====================================================

let folderHandle = null;
let spotlightResults = [];
let spotlightIndex = 0;
let cachedFiles = [];

// =====================================================
// LUA FILES HANDLER
// =====================================================

async function getLuaFiles(){
    const response = await fetch( "https://api.github.com/repos/TheoKVA/fusion-tools/contents/lua-clipboard/nodes" );
    const data = await response.json();
    return data
        .filter(file =>
            file.type === "file" &&
            file.name.endsWith(".lua")
        )
        .map(file => ({
            name: file.name,
            download_url: file.download_url
        }))
        .sort((a,b)=>
            a.name.localeCompare(b.name)
        );
}

// =====================================================
// COPY FILE
// =====================================================

async function copyFile(fileInfo, card = null){

    const response = await fetch(fileInfo.download_url);
    const text = await response.text();

    await navigator.clipboard.writeText(text);

    saveRecentTool(fileInfo.name);
    if(card){
        card.classList.add("copied");
        setTimeout(()=>{ card.classList.remove("copied"); },500);
    }
    showToast( `✓ ${displayName(fileInfo.name)} copied` );
}


// =====================================================
// TOAST
// =====================================================

function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        toast.style.display = "none";
    },2000);
}


// =====================================================
// DISPLAY NAMES
// =====================================================

function displayName(filename){

    let base = filename.replace(/\.lua$/i,'');

    if(base === "tDoD"){
        return "DoD";
    }

    return base
        .replace(/^t/,'')
        .replace(/([A-Z])/g,' $1')
        .trim();
}

function getAcronym(text){

    return text
        .split(" ")
        .filter(Boolean)
        .map(word => word[0])
        .join("")
        .toLowerCase();
}


// =====================================================
// FAVORITES
// =====================================================

function getFavorites(){
    return JSON.parse(
        localStorage.getItem("luaFavorites") || "[]"
    );
}

function setFavorites(list){
    localStorage.setItem(
        "luaFavorites",
        JSON.stringify(list)
    );
}

function isFavorite(filename){
    return getFavorites().includes(filename);
}

function toggleFavorite(filename){
    const favorites = getFavorites();
    const index = favorites.indexOf(filename);
    if(index >= 0){
        favorites.splice(index,1);
    }
    else{
        favorites.push(filename);
    }
    setFavorites(favorites);
    scan();
}


// =====================================================
// RECENT TOOLS
// =====================================================

function getRecentTools(){
    return JSON.parse(
        localStorage.getItem("recentTools") || "[]"
    );
}

function saveRecentTool(filename){

    let recent = getRecentTools();
    recent = recent.filter( x => x !== filename );
    recent.unshift(filename);
    recent = recent.slice(0,10);

    localStorage.setItem(
        "recentTools",
        JSON.stringify(recent)
    );
}

function createCard(fileInfo){

    const card = document.createElement("div");
    card.className = "file-card";

    const toolName = fileInfo.name.replace(/\.lua$/i,'');

    const icon = document.createElement("div");
    icon.className = "file-icon";
    icon.innerHTML = toolIcons[toolName]
        || (toolName.startsWith("tCheck") ? toolIcons.tCheck : null)
        || toolIcons.default;
    // icon.innerHTML = toolIcons[ fileInfo.name.replace(/\.lua$/i,'') ] || toolIcons.default;
    card.appendChild(icon);

    const nameBloc = document.createElement("div");
    nameBloc.className = "file-name-bloc";
    card.appendChild(nameBloc);

    const title = document.createElement("div");
    title.className = "file-title";
    title.textContent = displayName(fileInfo.name);
    nameBloc.appendChild(title);

    const filename = document.createElement("div");
    filename.className = "file-name";
    filename.textContent = fileInfo.name;
    nameBloc.appendChild(filename);

    const star = document.createElement("span");
    star.className = "favorite" + ( isFavorite(fileInfo.name) ? " active" : "");
    star.textContent = "★";
    star.onclick = (e)=>{
        e.stopPropagation();
        toggleFavorite( fileInfo.name);
    };
    card.appendChild(star);

    // Interaction
    card.onclick = ()=>{ copyFile(fileInfo,card); };

    return card;
}


// =====================================================
// GRID REFRESH
// =====================================================

async function scan(){

    const files = await getLuaFiles();

    cachedFiles = files;

    document.getElementById("countBadge").textContent = files.length + " Tools";

    const favorites = files.filter( file=> isFavorite(file.name) );
    const checks = files.filter( file => file.name.startsWith("tCheck") );
    const regular = files.filter( file=> !isFavorite(file.name) && !file.name.startsWith("tCheck"));

    // const container = document.getElementsByClassName("file-grid")[0];
    // container.innerHTML = ""; // empty the container

    const favoriteGrid = document.getElementById("favorite-grid");
    const toolGrid = document.getElementById("all-tool-grid");
    const checksGrid = document.getElementById("checks-grid");

    favoriteGrid.innerHTML = "";
    toolGrid.innerHTML = "";
    checksGrid.innerHTML = "";

    favorites.forEach(file => {
        favoriteGrid.appendChild( createCard(file) );
    });
    regular.forEach(file => {
        toolGrid.appendChild( createCard(file) );
    });
    checks.forEach(file => {
        checksGrid.appendChild( createCard(file) );
    });

    // hide the whole Favorites section
    // if there aren't any favorites
    favoriteGrid.parentElement.style.display = favorites.length ? "flex" : "none";
}

window.addEventListener( "load", async ()=>{ await scan(); } );


// =====================================================
// SPOTLIGHT
// =====================================================

function openSpotlight(){

    document
        .getElementById(
            "spotlightOverlay"
        )
        .style.display = "flex";

    const input =
        document.getElementById(
            "spotlightInput"
        );

    input.value = "";

    updateSpotlight();

    setTimeout(()=>{
        input.focus();
    },50);
}

function closeSpotlight(){

    document
        .getElementById(
            "spotlightOverlay"
        )
        .style.display = "none";
}

function updateSelection(){

    document
        .querySelectorAll(
            ".spotlight-item"
        )
        .forEach(
            (item,index)=>{

                item.classList.toggle(
                    "selected",
                    index === spotlightIndex
                );

            }
        );
}

function updateSpotlight(){

    const query =
        document
        .getElementById(
            "spotlightInput"
        )
        .value
        .toLowerCase()
        .trim();

    const container =
        document.getElementById(
            "spotlightResults"
        );

    container.innerHTML = "";

    if(query === ""){

        const recent =
            getRecentTools();

        spotlightResults =
            recent
            .map(name =>
                cachedFiles.find(
                    f=>f.name===name
                )
            )
            .filter(Boolean);

    }
    else{

        spotlightResults =
            cachedFiles.filter(file=>{

                const pretty =
                    displayName(
                        file.name
                    );

                const acronym =
                    getAcronym(
                        pretty
                    );

                return (
                    pretty
                    .toLowerCase()
                    .includes(query)

                    ||

                    file.name
                    .toLowerCase()
                    .includes(query)

                    ||

                    acronym
                    .includes(query)
                );
            });

        spotlightResults.sort((a,b)=>{

            const aFav =
                isFavorite(a.name);

            const bFav =
                isFavorite(b.name);

            return bFav - aFav;
        });
    }

    spotlightIndex = 0;

    spotlightResults.forEach(
        (file,index)=>{

            const div =
                document.createElement("div");

            div.className =
                "spotlight-item" +
                (
                    index===0
                    ? " selected"
                    : ""
                );

            div.innerHTML = `
                <div>${displayName(file.name)}</div>
                <div class="spotlight-sub">
                    ${file.name}
                </div>
            `;

            div.onclick = async ()=>{

                await copyFile(file);

                closeSpotlight();
            };

            container.appendChild(div);
        }
    );
}


// =====================================================
// BUTTON WIRING
// =====================================================

document.getElementById("spotlightInput").addEventListener("input", updateSpotlight);

// =====================================================
// KEYBOARD SHORTCUTS
// =====================================================

document.addEventListener(
    "keydown",
    async (e)=>{

        // Open spotlight:
        // Ctrl+Space
        // Cmd+Space
        // Shift+Space

        const openSearch =
            e.code === "Space" &&
            (
                e.ctrlKey ||
                e.metaKey ||
                e.shiftKey
            );

        if(openSearch){
            e.preventDefault();
            if(folderHandle){  openSpotlight(); }
            return;
        }

        const spotlightVisible = document.getElementById( "spotlightOverlay" ).style.display === "flex";

        if(!spotlightVisible){
            return;
        }

        // ESC closes
        if(e.key === "Escape"){
            closeSpotlight();
            return;
        }

        // Down
        if(e.key === "ArrowDown"){
            e.preventDefault();
            spotlightIndex = Math.min(
                spotlightResults.length - 1,
                spotlightIndex + 1
            );
            updateSelection();
            return;
        }

        // Up
        if(e.key === "ArrowUp"){
            e.preventDefault();
            spotlightIndex = Math.max(
                0,
                spotlightIndex - 1
            );
            updateSelection();
            return;
        }

        // Enter
        if(e.key === "Enter"){
            e.preventDefault();
            const selected = spotlightResults[ spotlightIndex ];
            if(selected){
                await copyFile(selected);
                closeSpotlight();
            }
            return;
        }
    }
);

document .getElementById( "spotlightOverlay" ).addEventListener( "click", (e)=>{ 
    if( e.target.id === "spotlightOverlay" ){ closeSpotlight(); } 
});


</script>
